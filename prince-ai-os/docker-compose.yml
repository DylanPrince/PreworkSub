# Local development services only. Not a production deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prince
      POSTGRES_PASSWORD: prince
      POSTGRES_DB: prince_ai_os
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prince -d prince_ai_os"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
